<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЁДБОН</title><link rel="stylesheet" href="style.css">
    <script>
        const t = localStorage.getItem('y_t') || "0";
        document.documentElement.className = t === "1" ? "theme-day" : "theme-night";
    </script>
</head>
<body>
    <header>
        <div class="logo" onclick="logoControl()">ЁДБОН</div>
        <div class="theme-switch" onclick="toggleTheme()"><div class="ball" id="t-icon">🌙</div></div>
    </header>
    <main class="container">
        <div id="slider" class="slider"></div>
        <h2 style="margin-bottom:20px;">Категорияҳо</h2>
        <div class="grid">
            <a href="category.html?cat=culture" class="card">🏛️<br>Фарҳанг</a>
            <a href="category.html?cat=history" class="card">📜<br>Таърих</a>
            <a href="category.html?cat=language" class="card">✍️<br>Забон</a>
            <a href="category.html?cat=chat" class="card">💬<br>Гуфтугӯ</a>
            <a href="category.html?cat=tourism" class="card" style="grid-column: span 2;">🏔️<br>Туризм</a>
        </div>
    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><div class="nav-icon">🏠</div>АСОСӢ</a>
        <a href="lessons.html" class="nav-item"><div class="nav-icon">🎓</div>ДАРСҲО</a>
        <a href="dictionary.html" class="nav-item"><div class="nav-icon">📖</div>ЛУҒАТ</a>
        <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>ПРОФИЛ</a>
    </nav>
    <script src="app.js"></script>
    <script>
        function initSlider() {
            const s = db('y_slider'); const box = document.getElementById('slider');
            if(!s.length) return box.style.display='none';
            box.innerHTML = s.map((x,i)=>`<div class="slide ${i===0?'active':''}" style="background-image:linear-gradient(transparent,rgba(0,0,0,0.7)), url('${x.url}')"><div class="slide-txt">${x.title}</div></div>`).join('');
            let c=0; if(s.length > 1) setInterval(()=>{
                const slides = document.querySelectorAll('.slide');
                slides[c].classList.remove('active'); c=(c+1)%slides.length; slides[c].classList.add('active');
            },5000);
        }
        window.onload = () => { applyTheme(); initSlider(); };
    </script>
</body>
</html>
