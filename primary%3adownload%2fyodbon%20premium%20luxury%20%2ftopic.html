<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бахш - ЁДБОН</title><link rel="stylesheet" href="style.css">
    <script>
        const t = localStorage.getItem('y_t') || "0";
        document.documentElement.className = t === "1" ? "theme-day" : "theme-night";
    </script>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='index.html'">ЁДБОН</div>
        <div class="theme-switch" onclick="toggleTheme()"><div class="ball" id="t-icon">🌙</div></div>
    </header>
    <main class="container">
        <div id="topic-flow"></div>
    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><div class="nav-icon">🏠</div>АСОСӢ</a>
        <a href="lessons.html" class="nav-item"><div class="nav-icon">🎓</div>ДАРСҲО</a>
        <a href="dictionary.html" class="nav-item"><div class="nav-icon">📖</div>ЛУҒАТ</a>
        <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>ПРОФИЛ</a>
    </nav>
    <script src="app.js"></script>
    <script>
        function render() {
            const cat = new URLSearchParams(window.location.search).get('cat') || 'history';
            const data = db('y_less').filter(x => x.cat === cat);
            document.getElementById('topic-flow').innerHTML = data.map(x => `
                <article class="topic-section">
                    <div class="topic-title-box"><h2 class="topic-title">${x.title}</h2></div>
                    <div class="topic-text">${x.cont.split('\n').map(p => `<p>${p}</p>`).join('')}</div>
                </article>
            `).join('');
        }
        window.onload = () => { applyTheme(); render(); };
    </script>
</body>
</html>
