<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бахш - ЁДБОН</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Ислоҳи фаврии реҷаи шаб
        const t = localStorage.getItem('y_t') || "0";
        document.documentElement.className = t === "1" ? "theme-day" : "theme-night";
    </script>
    <style>
        .topic-container {
            padding: 5px 0 50px;
        }

        .topic-article {
            margin-bottom: 40px; /* Фосилаи байни мақолаҳо кам шуд */
            animation: fadeIn 0.6s ease;
        }

        /* Сарлавҳаи тиллоии марказӣ */
        .topic-header {
            text-align: center;
            margin-bottom: 20px; /* Наздиктар ба матн */
        }

        .topic-title {
            font-size: 22px; /* Андозаи хурдтар ва зебо */
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            display: inline-block;
        }

        .topic-divider {
            width: 45px;
            height: 2px;
            background: var(--gold);
            margin: 10px auto 0;
            border-radius: 10px;
            opacity: 0.5;
        }

        /* Матни асосии зич ва хоно */
        .topic-content {
            font-size: 17px; /* Андозаи хурдтар ва мувофиқ */
            line-height: 1.6; /* Сатрҳо ба ҳам наздиктар шуданд */
            color: var(--text);
            text-align: justify;
            opacity: 0.95;
        }

        .topic-content p {
            margin-bottom: 12px; /* Абзатсҳо наздиктар шуданд */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='index.html'">ЁДБОН</div>
        <div class="theme-switch" onclick="toggleTheme()">
            <div class="ball" id="t-icon">🌙</div>
        </div>
    </header>

    <main class="container">
        <div id="topic-render" class="topic-container">
            </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><div class="nav-icon">🏠</div>АСОСӢ</a>
        <a href="lessons.html" class="nav-item"><div class="nav-icon">🎓</div>ДАРСҲО</a>
        <a href="dictionary.html" class="nav-item"><div class="nav-icon">📖</div>ЛУҒАТ</a>
        <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>ПРОФИЛ</a>
    </nav>

    <script src="app.js"></script>
    <script>
        function renderTopic() {
            const params = new URLSearchParams(window.location.search);
            const catKey = params.get('cat') || 'history';
            const box = document.getElementById('topic-render');
            
            const data = db('y_less').filter(x => x.cat === catKey);

            if (data.length === 0) {
                box.innerHTML = '<div style="text-align:center; padding:80px 20px; opacity:0.4;">Маълумот нест.</div>';
                return;
            }

            box.innerHTML = data.map(x => `
                <article class="topic-article">
                    <div class="topic-header">
                        <h1 class="topic-title">${x.title}</h1>
                        <div class="topic-divider"></div>
                    </div>
                    <div class="topic-content">
                        ${x.cont.split('\n').filter(t => t.trim() !== "").map(p => `<p>${p}</p>`).join('')}
                    </div>
                </article>
            `).join('');
        }

        window.onload = () => {
            applyTheme();
            renderTopic();
        };
    </script>
</body>
</html>
